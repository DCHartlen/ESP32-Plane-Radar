; Adafruit Qualia ESP32-S3 (N16R8) + 4" round 720×720 NV3052C RGB panel (HD40015C40)
; Board in Arduino IDE: "Adafruit Qualia ESP32-S3 RGB666"

; Framework settings for the RGB panel's bounce-buffer mode (Espressif's LCD FAQ). The
; prebuilt framework ships 32B data cache lines, -Os and flash XIP; see "Frame roll" in
; docs/qualia-port-plan.md. Setting any of these makes pioarduino rebuild the framework
; (first build of each env takes 10-30 min). Each env names it itself: pioarduino checks
; the env's own section for custom_sdkconfig, so it may not follow `extends`. "is not set"
; lines are quoted, else the INI parser drops them as comments; pioarduino strips the quotes.
[sdkconfig_display]
custom_sdkconfig =
  '# CONFIG_ESP32S3_DATA_CACHE_LINE_32B is not set'
  CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
  '# CONFIG_COMPILER_OPTIMIZATION_SIZE is not set'
  CONFIG_COMPILER_OPTIMIZATION_PERF=y
  CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
  CONFIG_SPIRAM_RODATA=y

[env:qualia]
custom_sdkconfig = ${sdkconfig_display.custom_sdkconfig}
; pioarduino = Arduino core 3.x / ESP-IDF 5 (needed for stable large RGB panels).
; Pinned: bump deliberately, not via "stable".
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = adafruit_qualia_s3_rgb666
framework = arduino
monitor_speed = 115200
; On the hardware USB-Serial/JTAG port, DTR/RTS drive the chip's reset and BOOT strap, so
; opening or closing the monitor could reset the board or leave it in the ROM bootloader
; (dark screen). Keep both released; uploads do their own reset.
monitor_dtr = 0
monitor_rts = 0
; Keeps the board's TinyUF2 slot at 0x410000 (flashed as an extra image by the board config).
board_build.partitions = partitions/plane_radar.csv

; Anti-aliased VLW fonts (Noto Sans Bold 25/32/64 px), from scripts/build_vlw_font.py
board_build.embed_files =
  data/ui_font_tag.vlw
  data/ui_font_small.vlw
  data/ui_font_large.vlw

; Serial is the S3's hardware USB-Serial/JTAG port (HWCDC) on the same USB-C connector, not
; the board's default TinyUSB CDC: pioarduino's framework rebuild for custom_sdkconfig can't
; include TinyUSB (pioarduino/platform-espressif32#505). CDC-on-boot comes from the board.
; -O2 instead of the platform's -Os, for draw time. Applies to our code, the libraries and
; the Arduino core sources; the prebuilt ESP-IDF libraries stay -Os.
build_unflags = -Os
build_flags =
  -O2
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DWM_NODEBUG
  -DWM_MDNS

; Exact versions, so a fresh checkout builds the same firmware. Arduino_GFX supplies the
; panel init sequence; bump these deliberately and recheck the display.
lib_deps =
  lovyan03/LovyanGFX@1.2.30
  moononournation/GFX Library for Arduino@1.6.8
  tzapu/WiFiManager@2.0.17
  bblanchon/ArduinoJson@7.4.3

; Phase 2 bring-up: color bars, circles, text, looped HTTPS, button levels.
; Wi-Fi uses the saved credentials, or add -DPANEL_TEST_WIFI_SSID=\"..\" -DPANEL_TEST_WIFI_PASS=\"..\".
[env:qualia_panel_test]
extends = env:qualia
custom_sdkconfig = ${sdkconfig_display.custom_sdkconfig}
build_flags =
  ${env:qualia.build_flags}
  -DPANEL_TEST

; The app with synthetic rain painted over every weather frame, to time the radar copy and
; the landmark blend on a dry day. WEATHER_FAKE_RAIN=2 rains on the whole screen.
[env:qualia_fake_rain]
extends = env:qualia
custom_sdkconfig = ${sdkconfig_display.custom_sdkconfig}
build_flags =
  ${env:qualia.build_flags}
  -DWEATHER_FAKE_RAIN=1
