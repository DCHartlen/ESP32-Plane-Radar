; Adafruit Qualia ESP32-S3 (N16R8) + 4" round 720×720 NV3052C RGB panel (HD40015C40)
; Board in Arduino IDE: "Adafruit Qualia ESP32-S3 RGB666"

[env:qualia]
; pioarduino = Arduino core 3.x / ESP-IDF 5 (needed for stable large RGB panels).
; Pinned: bump deliberately, not via "stable".
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = adafruit_qualia_s3_rgb666
framework = arduino
monitor_speed = 115200
; Keeps the board's TinyUF2 slot at 0x410000 (flashed as an extra image by the board config).
board_build.partitions = partitions/plane_radar.csv

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB-OTG (TinyUSB) CDC, matching the board default; CDC-on-boot comes from the board config.
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=0
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  moononournation/GFX Library for Arduino@^1.6.8
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2
